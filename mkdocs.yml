site_name: KDFlow
site_description: A user-friendly and efficient framework for LLM knowledge distillation.
site_url: https://kdflow.readthedocs.io/
repo_url: https://github.com/songmzhang/KDFlow
repo_name: songmzhang/KDFlow
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  favicon: assets/logo.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/songmzhang/KDFlow
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/repository/docker/songmzhang/kdflow/tags

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting_started/installation.md
      - Quickstart: getting_started/quickstart.md
  - User Guide:
      - Off-Policy KD: user_guide/off_policy_kd.md
      - On-Policy KD: user_guide/on_policy_kd.md
      - Cross-Tokenizer KD: user_guide/cross_tokenizer_kd.md
      - Supervised Fine-Tuning: user_guide/sft.md
      - Multimodal (VLM) Distillation: user_guide/multimodal.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - KD Algorithms: concepts/algorithms.md
      - KD Loss Functions: concepts/losses.md
  - Reference:
      - CLI Entry Points: reference/cli.md
      - Arguments: reference/arguments.md
      - Extending KDFlow: reference/extending.md
  - About:
      - Changelog: about/changelog.md
      - Citation: about/citation.md
      - License: about/license.md
